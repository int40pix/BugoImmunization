<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Figure 3.0 Architectural Design</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      background-color: #f1f5f9;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      color: #0f172a;
    }
    .widget-container {
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      max-width: 920px;
      width: 100%;
      box-shadow: 0 4px 16px rgba(0,0,0,0.06);
    }
    .control-panel {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      padding-bottom: 12px;
      border-bottom: 1px solid #e2e8f0;
      flex-wrap: wrap;
      gap: 10px;
    }
    .toggle-group {
      display: flex;
      gap: 6px;
      background: #f1f5f9;
      padding: 4px;
      border-radius: 6px;
    }
    .btn-toggle {
      border: none;
      padding: 6px 14px;
      font-size: 10pt;
      font-weight: bold;
      border-radius: 5px;
      cursor: pointer;
      background: transparent;
      color: #475569;
      transition: all 0.2s ease;
    }
    .btn-toggle.active {
      background: #ffffff;
      color: #0f172a;
      box-shadow: 0 1px 4px rgba(0,0,0,0.1);
    }
    .btn-download {
      background: #0f172a;
      color: #ffffff;
      border: none;
      padding: 8px 18px;
      font-size: 10.5pt;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: background 0.2s ease;
    }
    .btn-download:hover {
      background: #1e293b;
    }
    .canvas-wrapper {
      background: #ffffff;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: auto;
      padding: 10px 0;
    }
    svg {
      max-width: 100%;
      height: auto;
      background: #ffffff;
    }
  </style>
</head>
<body>

  <div class="widget-container">
    <div class="control-panel">
      <div class="toggle-group">
        <button id="btn-orig" class="btn-toggle active" onclick="switchMode('orig')">
          Exact Original Style (HTML5, JS, CSS3, Bootstrap, React, Laravel, MySQL)
        </button>
        <button id="btn-curr" class="btn-toggle" onclick="switchMode('curr')">
          Updated Stack (TypeScript, React 19, Inertia.js, Bootstrap 5, Laravel 12, PHP, MySQL)
        </button>
      </div>

      <button class="btn-download" onclick="downloadPNG()">
        <svg width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
          <path d="M.5 9.9a.5.5 0 0 1 .5.5v2.5a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-2.5a.5.5 0 0 1 1 0v2.5a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2v-2.5a.5.5 0 0 1 .5-.5z"/>
          <path d="M7.646 11.854a.5.5 0 0 0 .708 0l3-3a.5.5 0 0 0-.708-.708L8.5 10.293V1.5a.5.5 0 0 0-1 0v8.793L5.354 8.146a.5.5 0 1 0-.708.708l3 3z"/>
        </svg>
        Download High-Resolution Diagram (PNG)
      </button>
    </div>

    <div class="canvas-wrapper">
      <svg id="arch-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" width="880" height="560">
        <!-- Pure White Canvas (No outer borders, no cards) -->
        <rect width="880" height="560" fill="#ffffff"/>

        <!-- ==================== ROW 1: PRESENTATION LAYER ==================== -->
        <text x="35" y="44" font-family="Times New Roman, serif" font-size="20" font-weight="bold" fill="#000000">Presentation Layer</text>

        <!-- Left Device Icons: Phone, Monitor, PC Tower -->
        <g transform="translate(35, 58)">
          <!-- Smartphone -->
          <rect x="0" y="6" width="30" height="56" rx="5" fill="#ffffff" stroke="#000000" stroke-width="2.5"/>
          <line x1="11" y1="11" x2="19" y2="11" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
          <circle cx="15" cy="54" r="2" fill="#000000"/>
          
          <!-- Desktop Monitor -->
          <rect x="42" y="0" width="70" height="46" rx="3" fill="#ffffff" stroke="#000000" stroke-width="2.5"/>
          <polygon points="72,46 82,46 86,59 68,59" fill="#000000"/>
          <rect x="58" y="58" width="38" height="4" rx="1" fill="#000000"/>

          <!-- PC Tower -->
          <rect x="124" y="2" width="28" height="60" rx="2" fill="#000000"/>
          <rect x="128" y="9" width="20" height="5" fill="#ffffff"/>
          <rect x="128" y="18" width="20" height="5" fill="#ffffff"/>
          <circle cx="138" cy="46" r="3" fill="#ffffff"/>
        </g>

        <!-- Vertical Double-Headed Arrow 1 -->
        <path d="M 112 128 L 120 142 H 116 V 176 H 120 L 112 190 L 104 176 H 108 V 142 H 104 Z" fill="#ffffff" stroke="#000000" stroke-width="2.2"/>

        <!-- Horizontal Arrow 1 -->
        <path d="M 195 82 H 490 V 70 L 518 88 L 490 106 V 94 H 195 Z" fill="#ffffff" stroke="#000000" stroke-width="2.2"/>

        <!-- Row 1 Logos: Original Style -->
        <g id="row1-orig">
          <!-- HTML5 -->
          <g transform="translate(540, 36)">
            <text x="21" y="14" font-family="Arial, sans-serif" font-weight="900" font-size="12" fill="#000000" text-anchor="middle">HTML</text>
            <polygon points="0,20 42,20 38,68 21,73 4,68" fill="#e34f26"/>
            <polygon points="21,24 38,24 35,64 21,68" fill="#ef652a"/>
            <text x="21" y="56" font-family="Impact, Arial Black, sans-serif" font-weight="bold" font-size="28" fill="#ffffff" text-anchor="middle">5</text>
          </g>

          <!-- JS -->
          <g transform="translate(608, 36)">
            <text x="21" y="14" font-family="Arial, sans-serif" font-weight="900" font-size="12" fill="#000000" text-anchor="middle">JS</text>
            <polygon points="0,20 42,20 38,68 21,73 4,68" fill="#e5a910"/>
            <polygon points="21,24 38,24 35,64 21,68" fill="#f7df1e"/>
            <text x="21" y="55" font-family="Impact, Arial Black, sans-serif" font-weight="bold" font-size="23" fill="#ffffff" text-anchor="middle">JS</text>
          </g>

          <!-- CSS3 -->
          <g transform="translate(676, 36)">
            <text x="21" y="14" font-family="Arial, sans-serif" font-weight="900" font-size="12" fill="#000000" text-anchor="middle">CSS</text>
            <polygon points="0,20 42,20 38,68 21,73 4,68" fill="#1572b6"/>
            <polygon points="21,24 38,24 35,64 21,68" fill="#33a9dc"/>
            <text x="21" y="56" font-family="Impact, Arial Black, sans-serif" font-weight="bold" font-size="28" fill="#ffffff" text-anchor="middle">3</text>
          </g>

          <!-- Column 4: Bootstrap 5 (Top) & React (Bottom) -->
          <g transform="translate(748, 28)">
            <!-- Bootstrap Badge -->
            <g transform="translate(0, 0)">
              <rect x="0" y="0" width="40" height="42" rx="9" fill="#7952b3"/>
              <text x="20" y="30" font-family="Arial, sans-serif" font-weight="bold" font-size="27" fill="#ffffff" text-anchor="middle">B</text>
            </g>

            <!-- React Atom -->
            <g transform="translate(0, 56)">
              <ellipse cx="20" cy="18" rx="20" ry="7" fill="none" stroke="#00d8ff" stroke-width="2.2" transform="rotate(30 20 18)"/>
              <ellipse cx="20" cy="18" rx="20" ry="7" fill="none" stroke="#00d8ff" stroke-width="2.2" transform="rotate(90 20 18)"/>
              <ellipse cx="20" cy="18" rx="20" ry="7" fill="none" stroke="#00d8ff" stroke-width="2.2" transform="rotate(150 20 18)"/>
              <circle cx="20" cy="18" r="3.5" fill="#00d8ff"/>
              <text x="20" y="44" font-family="Arial, sans-serif" font-weight="bold" font-size="11" fill="#00d8ff" text-anchor="middle">React</text>
            </g>
          </g>
        </g>

        <!-- Row 1 Logos: Updated Stack (Initially Hidden) -->
        <g id="row1-curr" style="display:none;">
          <!-- HTML5 -->
          <g transform="translate(530, 36)">
            <text x="18" y="14" font-family="Arial, sans-serif" font-weight="900" font-size="11" fill="#000000" text-anchor="middle">HTML</text>
            <polygon points="0,20 36,20 33,64 18,68 3,64" fill="#e34f26"/>
            <polygon points="18,23 33,23 30,60 18,64" fill="#ef652a"/>
            <text x="18" y="53" font-family="Impact, Arial Black, sans-serif" font-weight="bold" font-size="24" fill="#ffffff" text-anchor="middle">5</text>
          </g>

          <!-- TS (TypeScript) -->
          <g transform="translate(585, 36)">
            <text x="19" y="14" font-family="Arial, sans-serif" font-weight="900" font-size="11" fill="#000000" text-anchor="middle">TS</text>
            <rect x="0" y="20" width="38" height="42" rx="3" fill="#3178c6"/>
            <text x="19" y="50" font-family="Arial, sans-serif" font-weight="bold" font-size="22" fill="#ffffff" text-anchor="middle">TS</text>
          </g>

          <!-- CSS3 -->
          <g transform="translate(640, 36)">
            <text x="18" y="14" font-family="Arial, sans-serif" font-weight="900" font-size="11" fill="#000000" text-anchor="middle">CSS</text>
            <polygon points="0,20 36,20 33,64 18,68 3,64" fill="#1572b6"/>
            <polygon points="18,23 33,23 30,60 18,64" fill="#33a9dc"/>
            <text x="18" y="53" font-family="Impact, Arial Black, sans-serif" font-weight="bold" font-size="24" fill="#ffffff" text-anchor="middle">3</text>
          </g>

          <!-- Bootstrap 5 -->
          <g transform="translate(695, 45)">
            <rect x="0" y="0" width="36" height="38" rx="8" fill="#7952b3"/>
            <text x="18" y="28" font-family="Arial, sans-serif" font-weight="bold" font-size="25" fill="#ffffff" text-anchor="middle">B</text>
          </g>

          <!-- React 19 -->
          <g transform="translate(748, 42)">
            <ellipse cx="18" cy="18" rx="18" ry="6.5" fill="none" stroke="#00d8ff" stroke-width="2.2" transform="rotate(30 18 18)"/>
            <ellipse cx="18" cy="18" rx="18" ry="6.5" fill="none" stroke="#00d8ff" stroke-width="2.2" transform="rotate(90 18 18)"/>
            <ellipse cx="18" cy="18" rx="18" ry="6.5" fill="none" stroke="#00d8ff" stroke-width="2.2" transform="rotate(150 18 18)"/>
            <circle cx="18" cy="18" r="3.2" fill="#00d8ff"/>
            <text x="18" y="44" font-family="Arial, sans-serif" font-weight="bold" font-size="10.5" fill="#00d8ff" text-anchor="middle">React</text>
          </g>

          <!-- Inertia.js -->
          <g transform="translate(805, 43)">
            <rect x="0" y="0" width="34" height="38" rx="5" fill="#9553e9"/>
            <text x="17" y="25" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">In</text>
            <text x="17" y="50" font-family="Arial, sans-serif" font-size="9.5" font-weight="bold" fill="#9553e9" text-anchor="middle">Inertia</text>
          </g>
        </g>

        <!-- ==================== ROW 2: APPLICATION LAYER ==================== -->
        <text x="35" y="215" font-family="Times New Roman, serif" font-size="20" font-weight="bold" fill="#000000">Application Layer</text>

        <!-- Left 3 Stacked Isometric Layers -->
        <g transform="translate(68, 230)">
          <polygon points="44,0 88,15 44,30 0,15" fill="#ffffff" stroke="#000000" stroke-width="2.5"/>
          <polygon points="44,18 88,33 44,48 0,33" fill="#ffffff" stroke="#000000" stroke-width="2.5"/>
          <polygon points="44,36 88,51 44,66 0,51" fill="#ffffff" stroke="#000000" stroke-width="2.5"/>
        </g>

        <!-- Vertical Double-Headed Arrow 2 -->
        <path d="M 112 308 L 120 322 H 116 V 356 H 120 L 112 370 L 104 356 H 108 V 322 H 104 Z" fill="#ffffff" stroke="#000000" stroke-width="2.2"/>

        <!-- Horizontal Arrow 2 -->
        <path d="M 195 254 H 490 V 242 L 518 260 L 490 278 V 266 H 195 Z" fill="#ffffff" stroke="#000000" stroke-width="2.2"/>

        <!-- Row 2 Logos: Original (Laravel alone) -->
        <g id="row2-orig" transform="translate(585, 222)">
          <path d="M 38 0 L 76 20 L 76 62 L 38 82 L 0 62 L 0 20 Z" fill="none" stroke="#ff2d20" stroke-width="3.5" stroke-linejoin="round"/>
          <line x1="38" y1="41" x2="38" y2="82" stroke="#ff2d20" stroke-width="3.5"/>
          <line x1="0" y1="20" x2="38" y2="41" stroke="#ff2d20" stroke-width="3.5"/>
          <line x1="76" y1="20" x2="38" y2="41" stroke="#ff2d20" stroke-width="3.5"/>
          <path d="M 52 14 L 66 21 L 66 35 L 52 42 L 38 35 L 38 21 Z" fill="none" stroke="#ff2d20" stroke-width="2"/>
        </g>

        <!-- Row 2 Logos: Updated (Laravel + PHP) -->
        <g id="row2-curr" style="display:none;" transform="translate(570, 222)">
          <!-- Laravel -->
          <g transform="translate(0, 0)">
            <path d="M 38 0 L 76 20 L 76 62 L 38 82 L 0 62 L 0 20 Z" fill="none" stroke="#ff2d20" stroke-width="3.5" stroke-linejoin="round"/>
            <line x1="38" y1="41" x2="38" y2="82" stroke="#ff2d20" stroke-width="3.5"/>
            <line x1="0" y1="20" x2="38" y2="41" stroke="#ff2d20" stroke-width="3.5"/>
            <line x1="76" y1="20" x2="38" y2="41" stroke="#ff2d20" stroke-width="3.5"/>
          </g>
          <!-- PHP -->
          <g transform="translate(100, 18)">
            <ellipse cx="36" cy="22" rx="36" ry="21" fill="#777bb4"/>
            <text x="36" y="29" font-family="Arial, sans-serif" font-weight="bold" font-size="20" fill="#ffffff" text-anchor="middle">php</text>
          </g>
        </g>

        <!-- ==================== ROW 3: DATABASE LAYER ==================== -->
        <text x="35" y="395" font-family="Times New Roman, serif" font-size="20" font-weight="bold" fill="#000000">Database Layer</text>

        <!-- Left 3 Stacked Database Cylinders -->
        <g transform="translate(82, 412)">
          <ellipse cx="30" cy="11" rx="30" ry="11" fill="#000000"/>
          <path d="M 0 11 V 26 C 0 34, 60 34, 60 26 V 11 Z" fill="#000000"/>
          <path d="M 0 29 V 44 C 0 52, 60 52, 60 44 V 29 Z" fill="#000000"/>
          <path d="M 0 47 V 62 C 0 70, 60 70, 60 62 V 47 Z" fill="#000000"/>
          <ellipse cx="30" cy="29" rx="30" ry="10" fill="none" stroke="#ffffff" stroke-width="2"/>
          <ellipse cx="30" cy="47" rx="30" ry="10" fill="none" stroke="#ffffff" stroke-width="2"/>
        </g>

        <!-- Horizontal Arrow 3 -->
        <path d="M 195 436 H 490 V 424 L 518 442 L 490 460 V 448 H 195 Z" fill="#ffffff" stroke="#000000" stroke-width="2.2"/>

        <!-- Database Layer Logo: MySQL Brand -->
        <g transform="translate(580, 410)">
          <path d="M 90 20 C 85 12, 75 6, 68 3 C 58 0, 50 1, 42 4 C 36 7, 32 12, 30 18 C 29 23, 31 27, 37 30 C 31 30, 23 27, 18 23 C 12 19, 9 12, 6 4 C 4 10, 4 17, 7 21 C 11 28, 17 33, 25 36 C 19 37, 11 38, 5 38 C 12 42, 21 42, 30 42 C 40 41, 51 36, 60 30 C 68 24, 76 19, 87 18 Z" fill="#00758f"/>
          <text x="2" y="68" font-family="Arial, sans-serif" font-weight="900" font-size="46" fill="#00758f">My<tspan fill="#f29111">SQL</tspan></text>
        </g>
      </svg>
    </div>
  </div>

  <script>
    function switchMode(mode) {
      const btnOrig = document.getElementById('btn-orig');
      const btnCurr = document.getElementById('btn-curr');
      const r1Orig = document.getElementById('row1-orig');
      const r1Curr = document.getElementById('row1-curr');
      const r2Orig = document.getElementById('row2-orig');
      const r2Curr = document.getElementById('row2-curr');

      if (mode === 'orig') {
        btnOrig.classList.add('active');
        btnCurr.classList.remove('active');
        r1Orig.style.display = 'inline';
        r1Curr.style.display = 'none';
        r2Orig.style.display = 'inline';
        r2Curr.style.display = 'none';
      } else {
        btnCurr.classList.add('active');
        btnOrig.classList.remove('active');
        r1Orig.style.display = 'none';
        r1Curr.style.display = 'inline';
        r2Orig.style.display = 'none';
        r2Curr.style.display = 'inline';
      }
    }

    function downloadPNG() {
      const svg = document.getElementById('arch-svg');
      const svgData = new XMLSerializer().serializeToString(svg);
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      const img = new Image();

      // High-resolution 3x scale (2640 x 1680)
      const scale = 3;
      canvas.width = 880 * scale;
      canvas.height = 560 * scale;

      img.onload = function() {
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.scale(scale, scale);
        ctx.drawImage(img, 0, 0);

        const a = document.createElement('a');
        a.download = 'figure_3_0_architectural_design.png';
        a.href = canvas.toDataURL('image/png');
        a.click();
      };

      img.src = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svgData)));
    }
  </script>
</body>
</html>
